name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repository. Without this the
# jobs inherit the repository's default token scope, which may be read/write.
permissions:
  contents: read

env:
  GOLANGCI_VERSION: v2.14.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out || (echo "Files need formatting:" && cat /tmp/gofmt.out && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-golangci-${{ env.GOLANGCI_VERSION }}-go1.27.3

      # Pinned, not `@latest`/`@master`: the linters changing under this repo
      # whenever upstream releases is a build that fails on a morning nobody
      # touched the code (CI was green on 2026-08-23 and red on 2026-09-16 with
      # no commit in between, because gosec grew a rule). Built FROM SOURCE,
      # though: golangci-lint reads the compiler's export data to typecheck, and
      # go1.27.2 bumped that format past what the prebuilt releases ship (they
      # are built with an older Go), so a prebuilt binary fails with "export
      # data version 5 is greater than maximum supported version 4". `go
      # install` recompiles it against the toolchain set up above.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          test -x ~/go/bin/golangci-lint && \
            ~/go/bin/golangci-lint version 2>/dev/null | grep -q "${GOLANGCI_VERSION#v}" && exit 0
          mkdir -p ~/go/bin
          GOBIN=~/go/bin go install \
            "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}"
          ~/go/bin/golangci-lint version

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: gosec
        uses: securego/gosec@v2.29.0
        with:
          args: -quiet ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      # PDFium runs as WebAssembly, and the race detector makes every call
      # through it several times slower. The suite shares its parsers, but
      # the default 10-minute panic still lands well inside a cold CI run.
      - name: Test
        run: go test -race -timeout 25m -coverprofile=coverage.out ./...

      - name: Coverage
        if: matrix.go-version == '1.27.3'
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: $COVERAGE"

      - name: Build
        run: go build ./...
