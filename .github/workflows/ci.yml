name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOLANGCI_VERSION: v2.13.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out || (echo "Files need formatting:" && cat /tmp/gofmt.out && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-go1.27

      # Pinned, both of them. `@latest` and `@master` mean the linters change
      # under this repository whenever upstream releases — which is a build that
      # fails on a morning nobody touched the code. It is not hypothetical: CI
      # was green on 2026-08-23 and red on 2026-09-16 with no commit in between,
      # because gosec grew a rule. Bumping these is now a Dependabot pull
      # request that can be read, not a surprise.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          test -x ~/go/bin/golangci-lint && \
            ~/go/bin/golangci-lint version 2>/dev/null | grep -q "${GOLANGCI_VERSION#v}" && exit 0
          mkdir -p ~/go/bin
          dir="golangci-lint-${GOLANGCI_VERSION#v}-linux-amd64"
          curl -sSfL -o /tmp/golangci.tar.gz \
            "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_VERSION}/${dir}.tar.gz"
          tar -xzf /tmp/golangci.tar.gz -C /tmp
          install -m 0755 "/tmp/${dir}/golangci-lint" ~/go/bin/golangci-lint
          ~/go/bin/golangci-lint version

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: gosec
        uses: securego/gosec@v2.29.0
        with:
          args: -quiet ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        if: matrix.go-version == '1.27'
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: $COVERAGE"

      - name: Build
        run: go build ./...
